# KiRL Training Configuration

defaults:
  - train_schema
  - algo: grpo
  - dataset: gsm8k
  - engine: fsdp
  - profiler: default
  - rollout: vllm
  - _self_

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}

# Training parameters
num_steps: 1000
batch_size: 8
gradient_accumulation_steps: 4
prompts_per_batch: 32

# Generation configuration
generation:
  max_new_tokens: 256
  temperature: 1.0
  top_p: 0.9
  do_sample: true

# Reward configuration
reward:
  type: "gsm8k_reward"  # "gsm8k_reward" | "math_reward" | "external_model"
  format_weight: 0.1  # Weight for format correctness

# Logging and evaluation
log_interval: 10
eval_interval: 100
eval_examples: 500

# Checkpointing
output_dir: "./outputs"
save_interval: 500
# Relative artifact paths are resolved beneath this run's output directory.
best_checkpoint_dir: "checkpoints/best"

# Reproducibility
seed: 42
deterministic: true

# Distributed training (set by torchrun)
# world_size: auto
# rank: auto
# local_rank: auto
